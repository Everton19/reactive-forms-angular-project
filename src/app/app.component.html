<div class="p-4 max-w-screen-xl mx-auto">
  <mat-card>
    <mat-card-content>
      <app-users-list [usersList]="usersList" (onUserSelected)="onUserSelected($event)"></app-users-list>

      <app-buttons-container [isEditMode]="isEditMode" (onEditButton)="onEditButton()"
        (onCancelButton)="onCancelButton()" *ngIf="userSelectedIndex !== undefined"></app-buttons-container>

      <app-user-informations-container *ngIf="userSelectedIndex !== undefined"
        [userSelected]="userSelected" [isEditMode]="isEditMode"></app-user-informations-container>
    </mat-card-content>
  </mat-card>
</div>
