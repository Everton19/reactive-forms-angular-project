name: Continuous Integration
on:
  pull_request:
    branches:
      - main
jobs:
  continuos-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: |
          npm install
          npm run build
          npm run test

